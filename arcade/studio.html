<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0d1b2a" />
  <title>酷丁狐遊戲工坊</title>
  <link rel="icon" href="../icon.svg" type="image/svg+xml" />
  <style>
    :root { --ink: #eef5ff; --muted: #9db3c8; --line: rgba(160,210,255,.18); --bar: #0d1b2a; --panel: #13263a; --amber: #ffc94a; --coral: #ff6f6f; --ok: #3ee69a; --cyan: #5fe1ff; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; height: 100%; background: #08131e; color: var(--ink); overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Microsoft JhengHei", sans-serif; }
    .btn { border: 1px solid rgba(95,225,255,.45); background: rgba(95,225,255,.12); color: var(--ink); font: 700 14px/1 inherit; font-family: inherit;
      padding: 9px 14px; border-radius: 999px; cursor: pointer; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; text-decoration: none; }
    .btn:hover { background: rgba(95,225,255,.22); }
    .btn:disabled { opacity: .45; cursor: default; }
    .btn.go { background: #2fbf71; border-color: #2fbf71; color: #04210f; font-size: 15px; padding: 10px 20px; }
    .btn.amber { background: var(--amber); border-color: var(--amber); color: #2b1d00; }
    .btn.ghost { background: transparent; }
    #app { position: fixed; inset: 0; display: flex; flex-direction: column; }
    .bar { flex: none; display: flex; align-items: center; gap: 10px; padding: 8px 12px; background: var(--bar); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
    .bar .title { display: flex; align-items: baseline; gap: 8px; }
    .bar .title b { font-size: 18px; letter-spacing: 1px; }
    .bar .title small { color: var(--muted); font-size: 12px; }
    .bar .grow { flex: 1; }
    .who { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
    .who b { color: var(--ink); }
    .status { font-size: 12px; color: var(--muted); min-width: 90px; text-align: right; }
    .status.err { color: var(--coral); } .status.ok { color: var(--ok); }
    .main { flex: 1; display: flex; min-height: 0; }
    #blockly { flex: 1; min-width: 0; position: relative; }
    .side { flex: none; width: min(46vw, 560px); background: var(--panel); border-left: 1px solid var(--line); display: flex; flex-direction: column; align-items: center; padding: 12px; gap: 10px; overflow-y: auto; }
    .screen { position: relative; width: 100%; max-width: 536px; aspect-ratio: 4 / 3; background: #0b1a26; border-radius: 10px; border: 3px solid #2b4560; overflow: hidden; box-shadow: 0 6px 24px rgba(0,0,0,.35); }
    #cv { width: 100%; height: 100%; display: block; image-rendering: pixelated; image-rendering: crisp-edges; touch-action: none; }
    .cover { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; background: rgba(8,19,30,.82); text-align: center; padding: 16px; }
    .cover[hidden] { display: none; }
    .cover h3 { margin: 0; font-size: 22px; } .cover p { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.6; }
    .ctl { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; align-items: center; }
    .auto { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 6px; cursor: pointer; user-select: none; }
    .pad { display: flex; justify-content: space-between; align-items: center; width: 100%; max-width: 536px; padding: 4px 6px; user-select: none; -webkit-user-select: none; touch-action: none; }
    .dpad { display: grid; grid-template-columns: repeat(3, 52px); grid-template-rows: repeat(3, 44px); gap: 4px; }
    .pad button { border: 2px solid rgba(255,255,255,.35); background: #1d3550; color: #fff; border-radius: 12px; font: 900 18px/1 system-ui, sans-serif; touch-action: none; cursor: pointer; }
    .pad button.on { background: var(--amber); color: #2b1d00; }
    .dpad .u { grid-column: 2; grid-row: 1; } .dpad .l { grid-column: 1; grid-row: 2; } .dpad .r { grid-column: 3; grid-row: 2; } .dpad .d { grid-column: 2; grid-row: 3; }
    .ab { display: flex; gap: 12px; align-items: center; }
    .ab button { width: 64px; height: 64px; border-radius: 50%; background: #c2502e; font-size: 22px; }
    .ab button.b { width: 52px; height: 52px; background: #6a4a8c; font-size: 18px; transform: translateY(18px); }
    .hint { font-size: 12.5px; color: var(--muted); text-align: center; line-height: 1.6; max-width: 536px; }
    .hint kbd { background: #24405c; border-radius: 4px; padding: 1px 6px; color: var(--ink); font-family: inherit; }
    .tabs { display: none; }
    .err { width: 100%; max-width: 536px; background: rgba(255,111,111,.15); border: 1px solid rgba(255,111,111,.5); color: #ffd3d3; padding: 8px 12px; border-radius: 8px; font-size: 13px; }
    .err[hidden] { display: none; }
    [hidden] { display: none !important; }
    .blocklyToolboxDiv { background: #eef2f6 !important; }
    .blocklyTreeLabel, .blocklyToolboxCategoryLabel { color: #1d2b3a !important; font-weight: 700; font-size: 15px; }
    .blocklyFlyoutLabelText { fill: #33475b !important; font-weight: 700; }
    /* 圖片下拉選單排成格子，不用一直捲 */
    .blocklyDropDownDiv .blocklyMenu:has(.blocklyMenuItem img) { display: grid !important; grid-template-columns: repeat(6, auto); max-height: none !important; gap: 2px; padding: 6px !important; }
    .blocklyDropDownDiv .blocklyMenu:has(.blocklyMenuItem img) .blocklyMenuItem { padding: 4px 6px !important; min-width: 0 !important; border-radius: 6px; }
    .blocklyDropDownDiv .blocklyMenu:has(.blocklyMenuItem img) .blocklyMenuItemCheckbox { display: none !important; }
    .blocklyDropDownDiv .blocklyMenu:has(.blocklyMenuItem img) .blocklyMenuItemSelected { background: rgba(255,201,74,.55) !important; outline: 2px solid #ffc94a; }
    .ro .blocklyToolboxDiv, .ro .blocklyFlyout { display: none !important; }
    @media (max-width: 860px) {
      .tabs { display: flex; gap: 6px; }
      .main { position: relative; }
      .side { position: absolute; inset: 0; width: auto; border-left: 0; }
      .main.show-blocks .side { visibility: hidden; }
      .main.show-game #blockly { visibility: hidden; }
      .bar .title small, .status { display: none; }
    }
    /* 存檔視窗 */
    .modal { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: flex; align-items: center; justify-content: center; z-index: 100; padding: 16px; }
    .modal[hidden] { display: none; }
    .modal .box { background: #13263a; border: 1px solid var(--line); border-radius: 14px; padding: 20px; width: min(420px, 100%); }
    .modal h3 { margin: 0 0 8px; } .modal p { color: var(--muted); font-size: 14px; line-height: 1.6; margin: 0 0 14px; }
  </style>
</head>
<body>
  <div id="app">
    <div class="bar">
      <a class="btn ghost" href="index.html" title="回到遊戲工坊">←</a>
      <div class="title"><b id="gName">遊戲工坊</b><small id="gGrade"></small></div>
      <div class="tabs"><button class="btn" id="tabBlocks">積木</button><button class="btn" id="tabGame">遊戲</button></div>
      <div class="grow"></div>
      <div class="who" id="who"></div>
      <span class="status" id="status"></span>
      <button class="btn amber" id="saveBtn">存檔</button>
    </div>
    <div class="main show-blocks" id="main">
      <div id="blockly"></div>
      <div class="side">
        <div class="screen">
          <canvas id="cv"></canvas>
          <div class="cover" id="cover"><h3 id="cTitle">準備好了嗎？</h3><p id="cText">把積木拼好，按「執行」就可以玩</p><button class="btn go" id="coverRun">▶ 執行</button></div>
        </div>
        <div class="ctl">
          <button class="btn go" id="runBtn">▶ 執行</button>
          <button class="btn" id="pauseBtn">❚❚ 暫停</button>
          <button class="btn" id="stopBtn">■ 停止</button>
          <label class="auto"><input type="checkbox" id="autoRun" checked /> 改積木就自動重新開始</label>
        </div>
        <div class="err" id="err" hidden></div>
        <div class="pad" id="pad">
          <div class="dpad"><button class="u" data-k="up">▲</button><button class="l" data-k="left">◀</button><button class="r" data-k="right">▶</button><button class="d" data-k="down">▼</button></div>
          <div class="ab"><button class="b" data-k="B">B</button><button data-k="A">A</button></div>
        </div>
        <div class="hint" id="hint"></div>
      </div>
    </div>
  </div>
  <div class="modal" id="modal" hidden><div class="box"><h3 id="mTitle"></h3><p id="mText"></p><div class="ctl" id="mBtns"></div></div></div>

  <script src="../vendor/blockly/blockly_compressed.js"></script>
  <script src="../vendor/blockly/blocks_compressed.js"></script>
  <script src="../vendor/blockly/javascript_compressed.js"></script>
  <script src="../vendor/blockly/msg/zh-hant.js"></script>
  <script src="config.js"></script>
  <script src="assets.js"></script>
  <script src="engine.js"></script>
  <script src="blocks.js"></script>
  <script src="games.js"></script>
  <script src="store.js"></script>
  <script src="studio.js"></script>
</body>
</html>
